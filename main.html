		function secondHighest(arr) {
			 let res = arr.sort((a, b) => a - b);

           if (res.length <= 1) {
                 return -1;
         }

         let largest = res[res.length - 1];\
       for (let i = res.length - 2; i >= 0; i--) {
        if (res[i] != largest) {
            return res[i];
        }
      }

       return -1;
		}
